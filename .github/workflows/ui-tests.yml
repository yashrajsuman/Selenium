name: UI Tests

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 21 * * *"      # nightly full regression (UTC)
  workflow_dispatch:
    inputs:
      groups:
        description: "JUnit tag expression (smoke, regression, visual)"
        default: "smoke"

jobs:
  ui-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      # If your app is in the same repo, start it here, e.g.:
      # - name: Start app under test
      #   run: docker compose -f docker-compose.app.yml up -d --wait

      - name: Pick tests to run
        id: pick
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            echo "groups=smoke | regression" >> "$GITHUB_OUTPUT"
          else
            echo "groups=${{ github.event.inputs.groups || 'smoke' }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Run Selenium tests
        run: >
          mvn -B test
          -Dheadless=true
          -Dbase.url=${{ vars.BASE_URL || 'https://the-internet.herokuapp.com' }}
          "-Dgroups=${{ steps.pick.outputs.groups }}"

      - name: Upload reports and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            target/surefire-reports
            target/screenshots
